# Set the server port (8080 is the default)
server.port=8080

# -- Database Connection --
# This tells Spring to use the campus_commute database you just created
spring.datasource.url=jdbc:mysql://localhost:3306/campus_commute

# Your MySQL username (default is 'root')
spring.datasource.username=root

# The password you created for MySQL
spring.datasource.password=rootroot

# -- JPA / Hibernate --
# This magic command tells Spring to auto-create or update your
# database tables based on your Java code. No SQL needed!
spring.jpa.hibernate.ddl-auto=update